name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: ${{ matrix.os }} Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22, 24]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify zero runtime dependencies
        shell: bash
        run: node -e "const p=require('./package.json'); if(Object.keys(p.dependencies || {}).length!==0) process.exit(1)"

      - name: Verify the CommonJS artifact
        run: node scripts/build-cjs.mjs --check

      - name: Run the test suite
        run: npm test
      - name: Run fast-check property fuzz tests
        run: npm run test:fuzz

      - name: Pack dry run
        run: npm pack --dry-run
